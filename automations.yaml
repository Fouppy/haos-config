- id: '1769005223143'
  alias: Sonoff Zigbee Button
  description: ''
  use_blueprint:
    path: sonoff/blueprint-zha-snzb-01p.yaml
    input:
      remote: 80774417407683d5c5d59e83bcefeea7

      single_press:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.movie_mode_active
                  state: "off"
              sequence:
                - action: script.audio_movie_mode_on
          default:
            - action: script.audio_movie_mode_off

      double_press:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.music_mode_active
                  state: "off"
              sequence:
                - action: script.audio_music_mode_on
          default:
            - action: script.audio_music_mode_off

      long_press:
        - action: script.audio_goodnight
- id: '1769007195923'
  alias: Door
  description: ''
  use_blueprint:
    path: Blackshome/sensor-light.yaml
    input:
      motion_trigger:
      - binary_sensor.ewelink_snzb_04p
      light_switch:
        entity_id: light.tz3210_cieijuw1_ts0505b_2
      time_delay: 0
      include_light_control:
      - use_brightness
      motion_bypass_lights_on: []
      include_bypass: []
      motion_bypass_lights_off: []
- id: '1778852485802'
  alias: Pause when phone
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.fouppy_s_1_15_phone_state
    to:
    - ringing
    for:
      hours: 0
      minutes: 0
      seconds: 2
  conditions: []
  actions:
  - action: media_player.media_pause
    metadata: {}
    target:
      device_id: c6468a7dcd11cd8f3b63a56ea4b2cc58
    data: {}
  mode: single
- id: '1778948952897'
  alias: Audio - Turn JVC on
  description: Allume le JVC quand le WiiM commence à jouer
  triggers:
  - entity_id: media_player.wiim_living_room
    to: playing
    trigger: state
  conditions:
  - condition: state
    entity_id: switch.jvc
    state: 'off'
  actions:
  - target:
      entity_id: switch.jvc
    action: switch.turn_on
  - delay:
      seconds: 2
  mode: single
- id: '1778949139300'
  alias: Audio - Turn JVC off
  description: Éteint le JVC si le WiiM reste idle/paused/off/standby 20 min.
  triggers:
  - entity_id: media_player.wiim_living_room
    to:
    - idle
    - paused
    - 'off'
    - standby
    for:
      minutes: 20
    trigger: state
  actions:
  - target:
      entity_id: switch.jvc
    action: switch.turn_off
  mode: restart
