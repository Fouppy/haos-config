- id: living_room_turn_jvc_on_when_wiim_plays
  alias: "Living Room: Turn JVC on when WiiM plays"
  mode: single
  trigger:
    - platform: state
      entity_id: media_player.wiim_living_room
      to: "playing"
  condition:
    - condition: state
      entity_id: switch.jvc
      state: "off"
  action:
    - action: script.living_room_turn_jvc_on

- id: living_room_turn_jvc_off_when_wiim_idle
  alias: "Living Room: Turn JVC off when WiiM idle"
  mode: restart
  trigger:
    - platform: state
      entity_id: media_player.wiim_living_room
      to:
        - "idle"
        - "paused"
        - "off"
        - "standby"
      for:
        minutes: 20
  action:
    - action: script.living_room_turn_jvc_off

- id: living_room_pause_wiim_on_fouppy_call
  alias: "Living Room: Pause WiiM on Fouppy call"
  mode: single
  trigger:
    - platform: state
      entity_id: sensor.fouppy_s_1_15_phone_state
      to: "ringing"
      for:
        seconds: 2
  condition:
    - condition: state
      entity_id: media_player.wiim_living_room
      state: "playing"
  action:
    - action: media_player.media_pause
      target:
        entity_id: media_player.wiim_living_room

- id: wakeup_music_weekdays
  alias: "Living Room: Wakeup music"
  mode: single

  trigger:
    - platform: template
      value_template: >
        {% set alarm = states('sensor.fouppy_s_1_15_next_alarm') %}
        {% if alarm not in ['unknown', 'unavailable', 'none', ''] %}
          {% set diff = as_timestamp(alarm) - as_timestamp(now()) %}
          {{ 0 <= diff < 60 }}
        {% else %}
          false
        {% endif %}

  condition:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
        - fri

    - condition: state
      entity_id: person.fouppy
      state: "home"

    - condition: state
      entity_id: person.moom
      state: "not_home"

  action:
    - action: script.living_room_turn_jvc_on

    - delay: "00:00:03"

    - action: media_player.volume_set
      target:
        entity_id: media_player.wiim_living_room
      data:
        volume_level: 0.4

    - delay: "00:00:01"

    - action: media_player.play_media
      target:
        entity_id: media_player.wiim_living_room
      data:
        media_content_id: "spotify:playlist:37i9dQZF1CKMFBxUbxRIAg"
        media_content_type: "playlist"