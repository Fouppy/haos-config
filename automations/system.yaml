---
- alias: "System: warning about high CPU usage"
  triggers:
    trigger: numeric_state
    entity_id: sensor.system_monitor_processor_use
    above: 70
    for:
      hours: 4
  actions:
    action: notify.phone_fouppy
    data:
      title: "System"
      message: "CPU usage has been above 70% for 4 hours! ⚠️🖥"

- alias: "System: warning about high CPU temperature"
  triggers:
    trigger: numeric_state
    entity_id: sensor.cpu_temperature_mean
    above: 70
    for:
      hours: 4
  actions:
    action: notify.phone_fouppy
    data:
      title: "System"
      message: "CPU temperature has been above 70 °C for 4 hours! ⚠️"

- alias: "System: SpeedTest"
  triggers:
    - trigger: time_pattern
      hours: /1
  conditions: []
  actions:
    - action: script.system_update_speedtest
  mode: single

- alias: "System: Status Notification"
  description: ""
  mode: parallel

  trigger:
    - platform: state
      entity_id:
        - binary_sensor.lxc_adguard_400_status
        - binary_sensor.lxc_cloud_103_status
        - binary_sensor.lxc_jellyfin_200_status
        - binary_sensor.lxc_proxy_102_status
        - binary_sensor.lxc_servarr_101_status
        - binary_sensor.lxc_vault_100_status
        - binary_sensor.node_proxmox_status
      to: "off"
      for:
        minutes: 2
      id: down

    - platform: state
      entity_id:
        - binary_sensor.lxc_adguard_400_status
        - binary_sensor.lxc_cloud_103_status
        - binary_sensor.lxc_jellyfin_200_status
        - binary_sensor.lxc_proxy_102_status
        - binary_sensor.lxc_servarr_101_status
        - binary_sensor.lxc_vault_100_status
        - binary_sensor.node_proxmox_status
      to: "on"
      for:
        seconds: 30
      id: up

  action:
    - choose:
        - conditions:
            - condition: trigger
              id: down
          sequence:
            - action: notify.phone_fouppy
              data:
                title: "🔴 Homelab Alert"
                message: >-
                  {{
                    trigger.to_state.name
                  }} ({{ trigger.entity_id }}) is DOWN

        - conditions:
            - condition: trigger
              id: up
          sequence:
            - action: notify.phone_fouppy
              data:
                title: "🟢 Homelab Restored"
                message: >-
                  {{
                    trigger.to_state.name
                  }} ({{ trigger.entity_id }}) is back online