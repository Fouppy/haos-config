- alias: "Utilities: washing machine or dishwasher started or finished"
  triggers:
    - trigger: state
      entity_id: binary_sensor.dishwasher
    - trigger: state
      entity_id: binary_sensor.washing_machine
  variables:
    from_state: "{{ trigger.from_state.state }}"
    to_state: "{{ trigger.to_state.state }}"
    name: "{{ trigger.entity_id.split('.', 1)[1] }}"
  conditions: "{{ (to_state == 'on' and from_state == 'off') or (to_state == 'off' and from_state == 'on') }}"
  actions:
    action: input_datetime.set_datetime
    data:
      entity_id: "input_datetime.{{ name }}_{{ to_state }}"
      timestamp: "{{ now().timestamp() }}"

- alias: "Utilities: washing machine notification"
  triggers:
    trigger: state
    entity_id: binary_sensor.washing_machine
    from: "on"
    to: "off"
  actions:
    action: script.utilities_notification
    data:
      name: "Washing machine"
      emojis: "👚👕"

- alias: "Utilities: dishwasher notification"
  triggers:
    trigger: state
    entity_id: binary_sensor.dishwasher
    from: "on"
    to: "off"
  actions:
    action: script.utilities_notification
    data:
      name: "Dishwasher"
      emojis: "🍽🍳"

- alias: "Utilities: Mosquito Plug Schedule"
  mode: single

  triggers:
    - trigger: sun
      event: sunset
      offset: "-00:30:00"
      id: on

    - trigger: sun
      event: sunrise
      offset: "+01:00:00"
      id: off

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: on
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.living_room_mosquito_plug

        - conditions:
            - condition: trigger
              id: off
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.living_room_mosquito_plug