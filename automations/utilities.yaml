- alias: "Utilities: Mosquito Plug Schedule"
  mode: single

  triggers:
    - trigger: sun
      event: sunset
      offset: "-00:30:00"
      id: "on"

    - trigger: sun
      event: sunrise
      offset: "+01:00:00"
      id: "off"

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: "on"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.living_room_mosquito_plug

        - conditions:
            - condition: trigger
              id: "off"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.living_room_mosquito_plug