# Custom components
pyscript: !include includes/pyscript.yaml
template migrated: !include_dir_merge_list migrated_templates
template: !include includes/templates.yaml

sensor:
  - platform: rest
    name: "Sensor Light Blueprint Gist Version Number"
    icon: mdi:cloud-tags
    resource: "https://gist.githubusercontent.com/Blackshome/6edfec0ff6a25c5da0d07b88dc908238/raw/sensor-light.yaml"
    method: GET
    headers:
      accept: "text/plain"
    value_template: >
      {% set match = value | regex_findall('\\*\\*Version:\\s*([0-9.]+)\\*\\*') %}
      {{ match[0] if match else 'unknown' }}
    scan_interval: 86400
