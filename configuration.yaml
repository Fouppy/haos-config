# Core Configuration
homeassistant: !include includes/homeassistant.yaml
default_config:
frontend:
  themes: !include_dir_merge_named themes
http: !include includes/http.yaml

# Managed via UI
scene: !include scenes.yaml
automation: !include automations.yaml
script: !include scripts.yaml

# Others
zone: !include includes/zones.yaml
# automation manual: !include automations.yaml
light: !include includes/lights.yaml
recorder: !include includes/recorder.yaml

# Custom components
template: !include includes/templates.yaml

sensor:
  - platform: rest
    name: "Sensor Light Blueprint Gist Version Number"
    icon: mdi:cloud-tags
    resource: "https://gist.githubusercontent.com/Blackshome/6edfec0ff6a25c5da0d07b88dc908238/raw/sensor-light.yaml"
    method: GET
    headers:
      accept: "text/plain"
    value_template: >
      {% set match = value | regex_findall('\\*\\*Version:\\s*([0-9.]+)\\*\\*') %}
      {{ match[0] if match else 'unknown' }}
    scan_interval: 86400
  - platform: rest
    name: "Sensor Light Add On Blueprint Gist Version Number"
