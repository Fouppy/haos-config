climate:
  - platform: dual_smart_thermostat
    name: Living Room Climate

    heater:
      - climate.dyson

    cooler:
      - climate.dyson

    target_sensor: sensor.dyson_temperature

    min_temp: 18
    max_temp: 30

    cold_tolerance: 1.0
    hot_tolerance: 0.7

    min_cycle_duration:
      minutes: 20

    initial_hvac_mode: cool
    precision: 0.1