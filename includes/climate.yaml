- platform: generic_thermostat
  name: Thermostat Salon
  unique_id: thermostat_salon
  heater: fan.dyson
  target_sensor: sensor.dyson_temperature

  ac_mode: true
  target_temp: 24
  min_temp: 18
  max_temp: 30
  precision: 0.5

  cold_tolerance: 0.8
  hot_tolerance: 0.8

  min_cycle_duration:
    minutes: 10