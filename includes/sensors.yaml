- platform: history_stats
  name: Hours TV has been on last 7 days
  entity_id: media_player.living_room_chromecast
  state: "on"
  type: time
  duration:
    days: 7
  end: "{{ now() }}"

- platform: history_stats
  name: Times TV has been on last 7 days
  entity_id: media_player.living_room_chromecast
  state: "on"
  type: count
  duration:
    days: 7
  end: "{{ now() }}"

