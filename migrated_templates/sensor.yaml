- sensor:
  - unit_of_measurement: '%'
    default_entity_id: sensor.tv_volume
    state: >-
      {{ state_attr("media_player.living_room_tv", "volume_level")|float(0) * 100 }}
    name: tv_volume
- sensor:
  - unit_of_measurement: s
    default_entity_id: sensor.timestamp_start_of_today
    state: >-
      {{ as_timestamp(now().replace(hour=0).replace(minute=0).replace(second=0)) }}
    name: timestamp_start_of_today
- sensor:
  - default_entity_id: sensor.n_days_last_month
    state: >-
      {% set start_of_month = now().replace(day=1) %} {% set start_of_last_month =
      start_of_month.replace(month=now().month-1) %} {{ ((start_of_month - start_of_last_month).total_seconds()
      / 86400) | round }}
    name: n_days_last_month
- sensor:
  - unit_of_measurement: kWh
    default_entity_id: sensor.daily_energy
    name: Daily Energy
    state: >-
      {{ states("sensor.all_energy_daily")|float(0) }}
- sensor:
  - unit_of_measurement: kWh
    default_entity_id: sensor.monthly_energy
    name: Monthly Energy
    state: >-
      {{ states("sensor.all_energy_monthly")|float(0) }}
- sensor:
  - unit_of_measurement: kWh
    default_entity_id: sensor.monthly_energy_last_period
    name: Monthly Energy (Last period)
    state: >-
      {{ state_attr("sensor.monthly_energy", "last_period")|float(0) }}
- sensor:
  - unit_of_measurement: €
    default_entity_id: sensor.monthly_energy_cost_last_period
    name: Monthly Energy Cost (Last period)
    state: >-
      {{ state_attr("sensor.monthly_energy_cost", "last_period")|float(0) }}
- sensor:
  - unit_of_measurement: €/kWh
    default_entity_id: sensor.energy_price
    name: Energy price
    state: >-
      {{ 0.2016 }}
- sensor:
  - unit_of_measurement: €
    default_entity_id: sensor.daily_energy_cost
    name: Daily Energy Cost
    state: >-
      {{ (states("sensor.daily_energy")|float(0) * states("sensor.energy_price")|float(0))
      | round(4) }}
- sensor:
  - unit_of_measurement: €
    default_entity_id: sensor.monthly_energy_cost
    name: Monthly Energy Cost
    state: >-
      {{ (states("sensor.monthly_energy")|float(0) * states("sensor.energy_price")|float(0))
      | round(4) }}
- sensor:
  - default_entity_id: sensor.nearest_phone_notify
    name: Nearest phone's notify service
    state: >-
      {% if is_state("person.fouppy", "home") and is_state("person.moom", "home")
      %}
        notify.all_phones
      {% elif 'Fouppy' in states('sensor.home_nearest_device') %}
        notify.phone_fouppy
      {% else %}
        notify.mobile_app_cph2465
      {% endif %}
- sensor:
  - unit_of_measurement: h
    default_entity_id: sensor.lights_on_total_hours
    name: Lights on total hours
    state: >-
      {{ states('sensor.hours_bedroom_lights_have_been_on_last_7_days')|float(0) *
      3
          + states('sensor.hours_living_room_lights_have_been_on_last_7_days')|float(0)
      * 6
          + states('sensor.hours_office_lights_has_been_on_last_7_days')|float(0)
      * 3
          + states('sensor.hours_kitchen_lights_have_been_on_last_7_days')|float(0)
      * 3
          + states('sensor.hours_hall_lights_have_been_on_last_7_days')|float(0) *
      1 }}
- sensor:
  - unit_of_measurement: h
    default_entity_id: sensor.lights_on_total_kwh
    state: >-
      {{ states('sensor.lights_on_total_hours')|float(0) * 5.4 / 1000 }}
    name: lights_on_total_kwh
- trigger:
    - trigger: numeric_state
      entity_id: sensor.sensor.living_room_light_sensor
      below: '20'
      for:
        minutes: 1
    - trigger: numeric_state
      entity_id: sensor.sensor.living_room_light_sensor
      above: '20'
      for:
        minutes: 1
    - platform: state
      entity_id: sensor.sensor.living_room_light_sensor
      to: 
        - 'unavailable'
        - 'unknown'
        - 'none'
      for:
        minutes: 1
