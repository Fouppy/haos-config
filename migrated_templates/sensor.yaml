- sensor:
  - unit_of_measurement: €/kWh
    default_entity_id: sensor.energy_price
    name: Energy price
    state: >-
      {{ 0.2016 }}
- trigger:
  - trigger: numeric_state
    entity_id: sensor.living_room_light_sensor
    below: '20'
    for:
      minutes: 1
  - trigger: numeric_state
    entity_id: sensor.living_room_light_sensor
    above: '20'
    for:
      minutes: 1
  - platform: state
    entity_id: sensor.living_room_light_sensor
    to: 
      - 'unavailable'
      - 'unknown'
      - 'none'
    for:
      minutes: 1
  sensor:
    name: "Illuminance Sensor"
    device_class: illuminance
    unit_of_measurement: lx
    state: "{{ states('sensor.living_room_light_sensor') | float(0.0) }}"