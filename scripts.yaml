turn_off_everything_non_automatic:
  alias: Turn off everything
  mode: parallel
  sequence:
    - action: light.turn_off
      data:
        transition: 4
        entity_id:
          - light.living_room_lights
          - light.bedroom_lights
          - light.office_lights
          - light.hall_lights
          - light.kitchen_lights
    - action: media_player.turn_off
      entity_id: media_player.chromecast_2

turn_off_everything:
  alias: Turn off everything
  mode: parallel
  sequence:
    - action: light.turn_off
      entity_id: all
    - action: script.turn_off_everything_non_automatic

leaving:
  alias: Leaving the house
  sequence:
    - action: script.turn_off_everything

utility_notification:
  alias: Utility notification
  fields:
    name:
      description: name
      example: washing_machine
    emojis:
      description: emojis
      example: "👚👕"
  sequence:
    - action: "{{ states('sensor.nearest_phone_notify') }}"
      data:
        title: "Utilities"
        message: "{{ name }} is done {{ emojis }}"

update_speedtest:
  alias: Update SpeedTest
  sequence:
    - action: hassio.addon_start
      metadata: {}
      data:
        addon: 6b87c29e_speedtest_addon

audio_jvc_on:
  alias: Audio - JVC ON
  mode: single
  sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.jvc

audio_jvc_off:
  alias: Audio - JVC OFF
  mode: single
  sequence:
    - action: switch.turn_off
      target:
        entity_id: switch.jvc

audio_movie_mode_on:
  alias: Audio - Movie Mode ON
  mode: single
  sequence:
    - action: scene.create
      data:
        scene_id: pre_movie_living_room
        snapshot_entities:
          - light.living_room_main_light
          - light.living_room_tv_light
          - light.living_room_string_lights
          - light.living_room_red_lamp
          - light.living_room_red_lava_lamp
          - light.living_room_blue_lava_lamp

    - action: light.turn_off
      target:
        entity_id:
          - light.living_room_main_light
          - light.living_room_red_lamp

    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.movie_mode_active

audio_movie_mode_off:
  alias: Audio - Movie Mode OFF
  mode: single
  sequence:
    - action: scene.turn_on
      target:
        entity_id: scene.pre_movie_living_room

    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.movie_mode_active

audio_music_mode_on:
  alias: Audio - Music Mode ON
  mode: single
  sequence:
    - action: script.audio_jvc_on

    - choose:
        - conditions:
            - condition: sun
              after: sunset
              after_offset: "-01:00:00"
          sequence:
            - action: scene.create
              data:
                scene_id: pre_music_living_room
                snapshot_entities:
                - light.living_room_main_light
                - light.living_room_tv_light
                - light.living_room_string_lights
                - light.living_room_red_lamp
                - light.living_room_red_lava_lamp
                - light.living_room_blue_lava_lamp

            - action: light.turn_on
              target:
                entity_id:
                  - light.living_room_string_lights
                  - light.living_room_red_lava_lamp
                  - light.living_room_blue_lava_lamp

    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.music_mode_active

audio_music_mode_off:
  alias: Audio - Music Mode OFF
  mode: single
  sequence:
    - action: media_player.media_pause
      target:
        entity_id: media_player.wiim_living_room

    - action: scene.turn_on
      target:
        entity_id: scene.pre_music_living_room

    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.music_mode_active

audio_goodnight:
  alias: Audio - Good Night
  mode: single
  sequence:
    - action: media_player.media_pause
      target:
        entity_id: media_player.wiim_living_room

    - action: script.audio_jvc_off

    - action: light.turn_off
      target:
        entity_id: light.living_room_lights

    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.movie_mode_active
          - input_boolean.music_mode_active