system_update_speedtest:
  alias: 'System: Update SpeedTest'
  sequence:
  - action: hassio.addon_start
    metadata: {}
    data:
      addon: 6b87c29e_speedtest_addon
living_room_goodnight:
  alias: 'Living Room: Goodnight'
  mode: single
  sequence:
  - action: media_player.media_pause
    target:
      entity_id: media_player.wiim_living_room
  - action: switch.turn_off
    target:
      entity_id: switch.jvc
  - action: media_player.turn_off
    target:
      entity_id: media_player.living_room_chromecast
  - action: light.turn_off
    target:
      entity_id: light.living_room_lights
  - action: light.turn_on
    metadata: {}
    target:
      entity_id: light.living_room_string_lights
    data: {}
  - delay:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  - action: light.turn_off
    metadata: {}
    target:
      entity_id: light.living_room_string_lights
    data: {}
living_room_switch_to_late_night_mode:
  sequence:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.jvc
    data: {}
  - action: light.turn_off
    metadata: {}
    target:
      entity_id: light.living_room_lights
    data: {}
  - action: light.turn_on
    metadata: {}
    target:
      entity_id: light.living_room_red_lamp
    data: {}
  - action: media_player.turn_on
    metadata: {}
    target:
      entity_id: media_player.living_room_chromecast
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
    enabled: true
  - action: media_player.volume_set
    metadata: {}
    target:
      device_id: 1afc8c66a55ad10c811c83c17b089188
    data:
      volume_level: 0.05
  - action: media_player.play_media
    metadata: {}
    target:
      entity_id: media_player.living_room_chromecast
    data:
      media:
        media_content_id: org.smarttube.stable
        media_content_type: app
        metadata:
          title: SmartTube
          thumbnail: https://smarttubeapp.github.io/images/site_logo.png
          media_class: app
          children_media_class:
          navigateIds:
          - {}
          browse_entity_id: media_player.living_room_chromecast
  alias: 'Living Room: Switch to late night mode'
  description: ''
  icon: mdi:lightbulb-night-outline
living_room_change_audio_to_optical:
  sequence:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.jvc
    data: {}
  - action: media_player.turn_on
    metadata: {}
    target:
      entity_id: media_player.living_room_chromecast
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
    enabled: true
  - action: media_player.volume_set
    metadata: {}
    target:
      device_id: 1afc8c66a55ad10c811c83c17b089188
    data:
      volume_level: 0
  - action: media_player.volume_set
    metadata: {}
    target:
      entity_id: media_player.wiim_living_room
    data:
      volume_level: 0.75
    enabled: true
  - action: media_player.select_source
    metadata: {}
    target:
      entity_id: media_player.wiim_living_room
    data:
      source: Optical In
  - action: media_player.select_sound_mode
    metadata: {}
    target:
      entity_id: media_player.wiim_living_room
    data:
      sound_mode: Spoken Word
    enabled: true
  - action: media_player.media_play
    metadata: {}
    target:
      entity_id: media_player.wiim_living_room
    data: {}
  - choose:
    - conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: media_player.living_room_chromecast
          state:
          - com.github.damontecres.wholphin
          attribute: app_id
      sequence:
      - action: media_player.play_media
        metadata: {}
        target:
          entity_id: media_player.living_room_chromecast
        data:
          media:
            media_content_id: com.github.damontecres.wholphin
            media_content_type: app
            metadata:
              navigateIds:
              - {}
              - media_content_type: ''
                media_content_id: __MANUAL_ENTRY__
              browse_entity_id: media_player.living_room_chromecast
  alias: 'Living Room: Change audio to optical'
  description: ''
  icon: mdi:movie-outline
living_room_turn_movie_lights_on:
  sequence:
  - action: light.turn_off
    metadata: {}
    target:
      entity_id: light.living_room_red_lamp
    data: {}
  - action: light.turn_off
    metadata: {}
    target:
      entity_id: light.living_room_main_light
    data: {}
  - action: light.turn_on
    metadata: {}
    target:
      entity_id: light.living_room_tv_light
    data: {}
  - action: light.turn_on
    metadata: {}
    target:
      entity_id: light.living_room_string_lights
    data: {}
  alias: 'Living Room: Turn movie lights on'
  description: ''
