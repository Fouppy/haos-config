presence_access_turn_off_everything_automatic:
  alias: "Presence & Access: Turn off everything"
  mode: parallel
  sequence:
    - action: light.turn_off
      data:
        transition: 4
        entity_id:
          - light.living_room_lights
          - light.bedroom_lights
          - light.office_lights
          - light.hall_lights
          - light.kitchen_lights

    - action: media_player.turn_off
      entity_id: media_player.living_room_chromecast

presence_access_turn_off_everything:
  alias: "Presence & Access: Turn off everything (automatic)"
  mode: parallel
  sequence:
    - action: light.turn_off
      entity_id: all

    - action: script.presence_access_turn_off_everything_automatic

presence_access_leaving_home:
  alias: "Presence & Access: Leaving home"
  sequence:
    - action: script.presence_access_turn_off_everything

utilities_notification:
  alias: "Utilities: Notification"
  fields:
    name:
      description: name
      example: washing_machine

    emojis:
      description: emojis
      example: "👚👕"

  sequence:
    - action: "{{ states('sensor.nearest_phone_notify') }}"
      data:
        title: "Utilities"
        message: "{{ name }} is done {{ emojis }}"

system_update_speedtest:
  alias: "System: Update SpeedTest"
  sequence:
    - action: hassio.addon_start
      metadata: {}
      data:
        addon: 6b87c29e_speedtest_addon

living_room_turn_jvc_on:
  alias: "Living Room: Turn JVC on"
  mode: single
  sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.jvc

living_room_turn_jvc_off:
  alias: "Living Room: Turn JVC off"
  mode: single
  sequence:
    - action: switch.turn_off
      target:
        entity_id: switch.jvc

living_room_movie_mode_on:
  alias: "Living Room: Movie Mode ON"
  mode: single
  sequence:
    - action: script.living_room_turn_jvc_on

    - action: scene.create
      data:
        scene_id: pre_movie_living_room
        snapshot_entities:
          - light.living_room_main_light
          - light.living_room_tv_light
          - light.living_room_string_lights
          - light.living_room_red_lamp
          - light.living_room_red_lava_lamp
          - light.living_room_blue_lava_lamp

    - action: light.turn_off
      continue_on_error: true
      target:
        entity_id:
          - light.living_room_main_light
          - light.living_room_tv_light

    - action: light.turn_on
      continue_on_error: true
      target:
        entity_id:
          - light.living_room_string_lights
          - light.living_room_red_lava_lamp
          - light.living_room_blue_lava_lamp

    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.movie_mode_active

living_room_movie_mode_off:
  alias: "Living Room: Movie Mode OFF"
  mode: single
  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {{ states('scene.pre_movie_living_room')
                not in ['unknown', 'unavailable'] }}
          sequence:
            - action: scene.turn_on
              continue_on_error: true
              target:
                entity_id: scene.pre_movie_living_room

            - delay:
                milliseconds: 500

            - action: scene.delete
              target:
                entity_id: scene.pre_movie_living_room

    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.movie_mode_active

living_room_music_mode_on:
  alias: "Living Room: Music Mode ON"
  mode: single
  sequence:
    - action: script.living_room_turn_jvc_on

    - action: scene.create
      data:
        scene_id: pre_music_living_room
        snapshot_entities:
          - light.living_room_main_light
          - light.living_room_tv_light
          - light.living_room_string_lights
          - light.living_room_red_lamp
          - light.living_room_red_lava_lamp
          - light.living_room_blue_lava_lamp

    - choose:
        - conditions:
            - condition: sun
              after: sunset
              after_offset: "-01:00:00"
              enabled: false
          sequence:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id:
                  - light.living_room_string_lights
                  - light.living_room_red_lava_lamp
                  - light.living_room_blue_lava_lamp
                  - light.living_room_red_lamp

    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.music_mode_active

living_room_music_mode_off:
  alias: "Living Room: Music Mode OFF"
  mode: single
  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {{ states('scene.pre_music_living_room')
                not in ['unknown', 'unavailable'] }}
          sequence:
            - action: scene.turn_on
              continue_on_error: true
              target:
                entity_id: scene.pre_music_living_room

            - delay:
                milliseconds: 500

            - action: scene.delete
              target:
                entity_id: scene.pre_music_living_room

    - choose:
        - conditions:
            - condition: state
              entity_id: media_player.wiim_living_room
              state: "playing"
          sequence:
            - action: media_player.media_pause
              continue_on_error: true
              target:
                entity_id: media_player.wiim_living_room

    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.music_mode_active

living_room_goodnight:
  alias: "Living Room: Goodnight"
  mode: single
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: media_player.wiim_living_room
              state: "playing"
          sequence:
            - action: media_player.media_pause
              target:
                entity_id: media_player.wiim_living_room

    - action: script.living_room_turn_jvc_off

    - choose:
        - conditions:
            - condition: state
              entity_id: media_player.living_room_chromecast
              state:
                - "on"
                - "playing"
                - "paused"
          sequence:
            - action: media_player.turn_off
              target:
                entity_id: media_player.living_room_chromecast

    - action: light.turn_off
      target:
        entity_id: light.living_room_lights

    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.movie_mode_active
          - input_boolean.music_mode_active